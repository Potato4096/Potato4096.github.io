<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 · Potato4096 Arcade</title>
  <link rel="stylesheet" href="../../platform/game-base.css">
  <link rel="stylesheet" href="../../platform/cheat-kit.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pg-container">
    <div class="pg-topbar">
      <button class="pg-btn pg-btn--ghost" id="btn-home" data-i18n="home">返回主页</button>
      <div class="hud">
        <span class="hud-item"><span class="hud-label" data-i18n="score">得分</span><b id="hud-score">0</b></span>
        <span class="hud-item"><span class="hud-label" data-i18n="best">最高分</span><b id="hud-best">0</b></span>
        <span class="hud-item"><span class="hud-label" data-i18n="moves">步数</span><b id="hud-moves">0</b></span>
        <span class="hud-item"><span class="hud-label" data-i18n="maxTile">最大方块</span><b id="hud-max">2</b></span>
      </div>
      <div class="top-actions">
        <button class="pg-btn pg-btn--ghost" id="btn-undo" data-i18n="undo">撤销</button>
        <button class="pg-btn pg-btn--ghost" id="btn-pause" data-i18n="pauseBtn">暂停</button>
        <button class="pg-btn pg-btn--ghost" id="btn-fullscreen" data-i18n="fullscreen">全屏</button>
      </div>
    </div>

    <div class="game-wrap">
      <div class="stage" id="stage">
        <div class="board-wrap">
          <div class="board" id="board" aria-label="2048 board"></div>
          <div class="score-float" id="score-float" hidden></div>
        </div>

        <div class="overlay" id="ov-menu">
          <div class="panel pg-card">
            <h1 class="game-title" data-i18n="title">2048</h1>
            <p class="tagline" data-i18n="tagline"></p>
            <p class="best-line"><span data-i18n="best">最高分</span> <b id="menu-best">0</b></p>
            <div class="btn-row">
              <button class="pg-btn" id="btn-start" data-i18n="start">开始游戏</button>
              <button class="pg-btn pg-btn--ghost" id="btn-clear" data-i18n="clearRecords">清除记录</button>
            </div>
          </div>
        </div>

        <div class="overlay" id="ov-pause" hidden>
          <div class="panel pg-card">
            <h2 class="game-title" data-i18n="paused">已暂停</h2>
            <div class="btn-row">
              <button class="pg-btn" id="btn-resume" data-i18n="resume">继续游戏</button>
              <button class="pg-btn pg-btn--ghost" id="btn-restart-pause" data-i18n="restart">重新开始</button>
              <button class="pg-btn pg-btn--ghost" id="btn-home-pause" data-i18n="home">返回主页</button>
            </div>
          </div>
        </div>

        <div class="overlay" id="ov-win" hidden>
          <div class="panel pg-card">
            <h2 class="game-title" data-i18n="winTitle">2048！达成！</h2>
            <p class="result-line"><span data-i18n="score">得分</span> <b id="win-score">0</b></p>
            <p class="best-line"><span data-i18n="best">最高分</span> <b id="win-best">0</b></p>
            <div class="btn-row">
              <button class="pg-btn" id="btn-continue" data-i18n="continuePlay">继续挑战</button>
              <button class="pg-btn pg-btn--ghost" id="btn-restart-win" data-i18n="restart">重新开始</button>
            </div>
          </div>
        </div>

        <div class="overlay" id="ov-gameover" hidden>
          <div class="panel pg-card">
            <h2 class="game-title" data-i18n="gameOver">游戏结束</h2>
            <p class="result-line"><span data-i18n="score">得分</span> <b id="go-score">0</b></p>
            <p class="result-line"><span data-i18n="moves">步数</span> <b id="go-moves">0</b></p>
            <p class="best-line"><span data-i18n="best">最高分</span> <b id="go-best">0</b></p>
            <div class="btn-row">
              <button class="pg-btn" id="btn-again-go" data-i18n="again">再玩一次</button>
              <button class="pg-btn pg-btn--ghost" id="btn-home-go" data-i18n="home">返回主页</button>
            </div>
          </div>
        </div>
      </div>

      <p class="pg-muted controls-hint" data-i18n="controls"></p>
    </div>
  </div>

  <script src="../../platform/game-api.js"></script>
  <script src="../../platform/cheat-kit.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
