<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go · Potato4096 Arcade</title>
  <link rel="stylesheet" href="../../platform/game-base.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game-wrap">
    <div class="pg-topbar">
      <button class="pg-btn pg-btn--ghost" id="btn-back">← <span data-t="back">返回主页</span></button>
      <span class="pg-tag" id="lang-badge">中文</span>
    </div>

    <h1 class="pg-muted" id="game-title" style="font-size:18px;margin:10px 2px 0;">围棋 · 双人对弈</h1>

    <div class="game-layout">
      <div class="board-col">
        <div class="status-bar pg-card">
          <span class="turn-dot is-black" id="turn-dot"></span>
          <span id="status-text">请选择对局模式</span>
          <span class="move-count pg-muted" id="move-count">第 0 手</span>
        </div>

        <div class="board-frame">
          <canvas id="board"></canvas>
        </div>

        <p class="pg-muted" id="hint" style="font-size:13px;margin:10px 2px 0;"></p>
      </div>

      <div class="side-col">
        <div class="side-panel pg-card">
          <div class="mode-row">
            <span class="pg-muted" data-t="modeLabel">模式</span>
            <b id="mode-label">-</b>
            <button class="pg-btn pg-btn--ghost mode-switch" id="btn-switch-mode" data-t="switchMode">切换模式</button>
          </div>

          <div class="size-row">
            <span class="pg-muted" data-t="boardSize">棋盘</span>
            <div class="size-btns">
              <button class="pg-btn pg-btn--ghost size-btn" data-size="9">9</button>
              <button class="pg-btn pg-btn--ghost size-btn" data-size="13">13</button>
              <button class="pg-btn pg-btn--ghost size-btn is-active" data-size="19">19</button>
            </div>
          </div>

          <div class="stats-row">
            <span class="stat"><span class="dot black"></span><span data-t="blackCaptures">黑提</span> <b id="cap-black">0</b></span>
            <span class="stat"><span class="dot white"></span><span data-t="whiteCaptures">白提</span> <b id="cap-white">0</b></span>
            <span class="stat"><span class="dot draw"></span><span data-t="komiLabel">贴目</span> <b>7.5</b></span>
          </div>

          <div class="actions">
            <button class="pg-btn" id="btn-undo" data-t="undo">悔棋</button>
            <button class="pg-btn pg-btn--ghost" id="btn-pass" data-t="pass">虚手</button>
          </div>
          <div class="actions actions--split">
            <button class="pg-btn pg-btn--ghost" id="btn-resign" data-t="resign">认输</button>
            <button class="pg-btn pg-btn--ghost" id="btn-restart" data-t="restart">重新开始</button>
          </div>
          <button class="pg-btn pg-btn--ghost btn-clear" id="btn-clear" data-t="clear">清除记录</button>

          <h2 class="panel-title" data-t="record">棋谱</h2>
          <div class="move-list" id="move-list">
            <div class="move-empty" data-t="noMoves">尚未落子</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 模式选择浮层 -->
  <div class="mode-overlay" id="mode-overlay">
    <div class="mode-box pg-card">
      <h2 class="mode-title" data-t="modeTitle">选择对局模式</h2>
      <button class="pg-btn mode-big" id="btn-mode-pvp">
        <span class="mode-big-title" data-t="modePvp">双人对弈</span>
        <span class="mode-big-sub" data-t="modePvpSub">两人轮流落子</span>
      </button>
      <div class="mode-ai-block">
        <div class="mode-ai-title" data-t="modeAi">人机对战</div>
        <div class="diff-row">
          <button class="pg-btn pg-btn--ghost" data-diff="easy" data-t="diffEasy">简单</button>
          <button class="pg-btn pg-btn--ghost" data-diff="medium" data-t="diffMedium">中等</button>
          <button class="pg-btn pg-btn--ghost" data-diff="hard" data-t="diffHard">困难</button>
        </div>
        <p class="mode-ai-sub pg-muted" data-t="modeAiSub">你执黑先行，电脑执白</p>
      </div>
    </div>
  </div>

  <!-- 终局浮层 -->
  <div class="result-overlay" id="result-overlay">
    <div class="result-box pg-card">
      <h2 class="result-title" id="result-title">对局结束</h2>
      <div class="score-table" id="score-table"></div>
      <div class="actions">
        <button class="pg-btn" id="btn-again" data-t="again">再来一局</button>
        <button class="pg-btn pg-btn--ghost" id="btn-review" data-t="review">查看棋盘</button>
      </div>
    </div>
  </div>

  <script src="../../platform/game-api.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
