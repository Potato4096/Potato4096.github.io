<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Monopoly">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6b57"/>
      <stop offset="1" stop-color="#173f34"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e8f0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="url(#board)"/>
  <rect x="12" y="12" width="104" height="104" rx="12" fill="none" stroke="#8fd6b6" stroke-opacity="0.45" stroke-width="2"/>

  <!-- 环形象棋格 -->
  <g>
    <rect x="20" y="100" width="14" height="14" rx="2" fill="#8a5a3c"/>
    <rect x="38" y="100" width="14" height="14" rx="2" fill="#79c2e6"/>
    <rect x="56" y="100" width="14" height="14" rx="2" fill="#d65d8e"/>
    <rect x="74" y="100" width="14" height="14" rx="2" fill="#e08a37"/>
    <rect x="92" y="100" width="14" height="14" rx="2" fill="#d4484b"/>
    <rect x="20" y="82" width="14" height="14" rx="2" fill="#d9b12e"/>
    <rect x="92" y="82" width="14" height="14" rx="2" fill="#379a6b"/>
    <rect x="20" y="64" width="14" height="14" rx="2" fill="#3d5cc0"/>
    <rect x="92" y="64" width="14" height="14" rx="2" fill="#8a5a3c"/>
    <rect x="20" y="20" width="14" height="14" rx="2" fill="#2f9e6e"/>
    <rect x="92" y="20" width="14" height="14" rx="2" fill="#c0453f"/>
    <rect x="38" y="20" width="14" height="14" rx="2" fill="#79c2e6"/>
    <rect x="56" y="20" width="14" height="14" rx="2" fill="#d65d8e"/>
    <rect x="74" y="20" width="14" height="14" rx="2" fill="#e08a37"/>
  </g>

  <!-- 骰子 -->
  <g transform="rotate(-12 64 64)">
    <rect x="42" y="38" width="44" height="44" rx="9" fill="url(#face)" stroke="#b9c3d2" stroke-width="2"/>
    <circle cx="54" cy="50" r="4" fill="#2a3342"/>
    <circle cx="74" cy="50" r="4" fill="#2a3342"/>
    <circle cx="64" cy="60" r="4" fill="#d4484b"/>
    <circle cx="54" cy="70" r="4" fill="#2a3342"/>
    <circle cx="74" cy="70" r="4" fill="#2a3342"/>
  </g>

  <!-- 小房子 -->
  <g transform="translate(84 78)">
    <rect x="0" y="12" width="22" height="16" rx="2" fill="#f2f6ff"/>
    <path d="M-4 12 L11 -1 L26 12 Z" fill="#d4484b"/>
    <rect x="8" y="19" width="7" height="9" fill="#8a94a6"/>
  </g>
</svg>
