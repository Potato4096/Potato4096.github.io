<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Ludo">
  <defs>
    <radialGradient id="lp" cx="35%" cy="32%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f2f4f8"/>
      <stop offset="1" stop-color="#c3c9d4"/>
    </radialGradient>
    <linearGradient id="lred" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8b7c"/>
      <stop offset="1" stop-color="#d63b2e"/>
    </linearGradient>
    <linearGradient id="lyel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76b"/>
      <stop offset="1" stop-color="#e0a51f"/>
    </linearGradient>
    <linearGradient id="lblu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cb2ff"/>
      <stop offset="1" stop-color="#2a6fd6"/>
    </linearGradient>
    <linearGradient id="lgrn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee2a2"/>
      <stop offset="1" stop-color="#26a257"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="20" fill="url(#lp)"/>
  <rect x="4" y="4" width="120" height="120" rx="20" fill="none" stroke="#aab2c0" stroke-width="2"/>

  <!-- 四角机库 -->
  <rect x="12" y="12" width="38" height="38" rx="8" fill="url(#lyel)" opacity="0.9"/>
  <rect x="78" y="12" width="38" height="38" rx="8" fill="url(#lblu)" opacity="0.9"/>
  <rect x="12" y="78" width="38" height="38" rx="8" fill="url(#lred)" opacity="0.9"/>
  <rect x="78" y="78" width="38" height="38" rx="8" fill="url(#lgrn)" opacity="0.9"/>

  <!-- 中心四色 -->
  <path d="M64 64 L52 76 L76 76 Z" fill="#d63b2e"/>
  <path d="M64 64 L52 52 L52 76 Z" fill="#e0a51f"/>
  <path d="M64 64 L52 52 L76 52 Z" fill="#2a6fd6"/>
  <path d="M64 64 L76 52 L76 76 Z" fill="#26a257"/>

  <!-- 飞机 -->
  <g transform="translate(64 30) rotate(45)">
    <path d="M0 -11 L5 4 L0 1 L-5 4 Z" fill="#2f7de0" stroke="#1c4f96" stroke-width="1"/>
    <path d="M-5 4 L0 7 L5 4 L0 2 Z" fill="#245fb5"/>
  </g>
  <g transform="translate(30 92) rotate(-30)">
    <path d="M0 -11 L5 4 L0 1 L-5 4 Z" fill="#e2483c" stroke="#9c2c1c" stroke-width="1"/>
    <path d="M-5 4 L0 7 L5 4 L0 2 Z" fill="#b23325"/>
  </g>
